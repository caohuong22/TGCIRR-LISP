name: CI

# Chay tren Windows vi test project nham net48 va script dung PowerShell.
# Khong build TGIRR.slnx o day: 3 project CAD can DLL tham chieu trong
# Reference\ (bi gitignore, ~155MB). Tren may dev co Reference\ thi
# scripts/test-palette.ps1 tu build ca solution.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # [1] Catalog la nguon duy nhat: menu, ToolCatalog, shim, docs phai khop
      - name: Kiem tra catalog (tools.json)
        shell: pwsh
        run: ./scripts/gen-catalog.ps1 -Check

      # [2] Ban port ZWCAD/GstarCAD phai khop src/ribbon + src/shared
      - name: Kiem tra ban port
        shell: pwsh
        run: ./scripts/port-verify.ps1

      # [3] Chay moi regression test (tu dong liet ke trong tests\)
      - name: Chay regression test
        shell: pwsh
        run: |
          $failed = @()
          Get-ChildItem tests -Directory | ForEach-Object {
            $proj = Join-Path $_.FullName ($_.Name + '.csproj')
            if (-not (Test-Path $proj)) { return }
            Write-Host "== $($_.Name) =="
            dotnet run --project $proj -c Release
            if ($LASTEXITCODE -ne 0) { $failed += $_.Name }
          }
          if ($failed.Count -gt 0) { throw "Regression that bai: $($failed -join ', ')" }
